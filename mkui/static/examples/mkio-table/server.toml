name = "order-book"
version = "1.0.0"
port = 8080
host = "0.0.0.0"
db_path = "orders.db"
# Apply safe schema changes (like adding a column) to an existing orders.db.
auto_migrate = "safe"

[tables.orders]
# `ts` is stamped by SQLite in UTC (`YYYY-MM-DD HH:MM:SS`), a format the
# table recognises as a time, so its filter dropdown offers a date range.
# `parent_id` nests child orders under a parent (the Order Tree pane): a
# row whose parent_id is empty is a top-level order.
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", ts = "TEXT DEFAULT CURRENT_TIMESTAMP", side = "TEXT NOT NULL", symbol = "TEXT NOT NULL", qty = "INTEGER", price = "REAL DEFAULT 0", status = "TEXT DEFAULT 'pending'", parent_id = "INTEGER" }
# `versioned = true` is the whole switch: mkio numbers every version of
# every row (`_mkio_version`, 1 on insert and +1 per edit) and records it
# in a companion `orders__history` table, stamped with the ref, the user,
# and the service the change came through. `auto_migrate = "safe"` above
# turns it on for an orders.db that predates this line — the history table
# is created and every live row recorded as its baseline version.
versioned = true

# Write endpoint: place and manage orders
[services.orders]
protocol = "transaction"

[services.orders.ops]
new    = [{ table = "orders", op_type = "insert", fields = ["side", "symbol", "qty", "price"] }]
child  = [{ table = "orders", op_type = "insert", fields = ["side", "symbol", "qty", "price", "parent_id"] }]
fill   = [{ table = "orders", op_type = "update", key = ["id"], fields = ["status"], defaults = { status = "filled" } }]
cancel = [{ table = "orders", op_type = "update", key = ["id"], fields = ["status"], defaults = { status = "cancelled" } }]
# undo/redo take only the key — the values come from the history table —
# and record no new version, so a step is always reversible. Undoing
# version 1 removes the row and keeps its versions, so redo can rebuild it.
undo   = [{ table = "orders", op_type = "undo", key = ["id"] }]
redo   = [{ table = "orders", op_type = "redo", key = ["id"] }]

# Live table of all orders (mkui subscribes here)
[services.all_orders]
protocol = "query"
primary_table = "orders"
filterable = ["status", "symbol"]

# Last filled trade per symbol
[services.last_trade]
protocol = "subpub"
primary_table = "orders"
topic = "symbol"
where = "status == 'filled'"

[services.last_trade.publish]
symbol = "symbol"
side   = "side"
price  = "price"
qty    = "qty"

[services.last_trade.defaults]
symbol = "_mkio_topic"

# ─── Record history ───────────────────────────────────────────────────
# mkio never advertises a history table and writes no service for one, so
# these four are the deliberate choice to expose it. Each would take its
# own `access` rule on a server with authentication enabled — audit
# visibility is a permission like any other.

# One record's chain, oldest first: what the history pane reads.
[services.order_versions]
protocol = "reqrep"
sql = "SELECT * FROM orders__history WHERE id = :id ORDER BY _mkio_version"

# Where a record sits in its chain: the version its live row is on, and the
# highest recorded. `current` is null once the row has been undone away.
# This is what tells the client whether redo has anywhere to go.
[services.order_state]
protocol = "reqrep"
sql = "SELECT (SELECT _mkio_version FROM orders WHERE id = :id) AS current, MAX(_mkio_version) AS top FROM orders__history WHERE id = :id"

# The audit tape: every recorded version, newest first, live as they land.
# The seeder fills and cancels orders as it runs, so the chains build up
# on their own.
[services.order_history]
protocol = "query"
primary_table = "orders__history"
sql = "SELECT * FROM orders__history ORDER BY _mkio_ref DESC"
filterable = ["id", "symbol", "status", "_mkio_op", "_mkio_user"]
change_log_size = 10000

# The table as it stood at a moment: for each id, the newest version
# recorded at or before `as_of`. Refs sort lexicographically, so the cutoff
# is an ordinary range scan.
#
# Reconstructed from recorded versions, which is not quite the same as
# "what the table showed then": undo and redo move a row's cursor without
# recording anything, so a row undone at 3pm still reads, as of 2pm, as
# whatever its newest version by 2pm was.
[services.order_as_of]
protocol = "reqrep"
sql = """
SELECT h.* FROM orders__history h
  JOIN (SELECT id, MAX(_mkio_version) AS v
          FROM orders__history
         WHERE _mkio_ref <= :as_of
      GROUP BY id) latest
    ON h.id = latest.id AND h._mkio_version = latest.v
 ORDER BY h.id
"""

# Saved window layouts for mkui's Layout menu: one row per save, the
# newest being the current layout (`delete` is how the client prunes the
# history). With no login on this server every save goes to the default
# history (owner "").
[tables.mkui_layouts]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", app = "TEXT NOT NULL DEFAULT ''", owner = "TEXT NOT NULL DEFAULT ''", saved = "TEXT DEFAULT CURRENT_TIMESTAMP", layout = "TEXT NOT NULL" }

[services.mkui_layouts]
protocol = "transaction"

[services.mkui_layouts.ops]
save = [{ table = "mkui_layouts", op_type = "insert", fields = ["app", "owner", "layout"] }]
delete = [{ table = "mkui_layouts", op_type = "delete", key = ["id"] }]

[services.mkui_layouts_list]
protocol = "reqrep"
sql = "SELECT id, saved FROM mkui_layouts WHERE app = :app AND owner = :owner ORDER BY id DESC"

[services.mkui_layouts_get]
protocol = "reqrep"
sql = "SELECT id, saved, layout FROM mkui_layouts WHERE id = :id"

# Serve frontend: app at /, mkui framework assets at /mkui/
[static]
"/" = "./static"
"/mkui" = "../../"

# Serve config files
[config]
"/config" = "./config"
