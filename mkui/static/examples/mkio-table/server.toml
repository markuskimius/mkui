name = "order-book"
version = "1.0.0"
port = 8080
host = "0.0.0.0"
db_path = "orders.db"
# Apply safe schema changes (like adding a column) to an existing orders.db.
auto_migrate = "safe"

[tables.orders]
# `ts` is stamped by SQLite in UTC (`YYYY-MM-DD HH:MM:SS`), a format the
# table recognises as a time, so its filter dropdown offers a date range.
# `parent_id` nests child orders under a parent (the Order Tree pane): a
# row whose parent_id is empty is a top-level order.
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", ts = "TEXT DEFAULT CURRENT_TIMESTAMP", side = "TEXT NOT NULL", symbol = "TEXT NOT NULL", qty = "INTEGER", price = "REAL DEFAULT 0", status = "TEXT DEFAULT 'pending'", parent_id = "INTEGER" }

# Write endpoint: place and manage orders
[services.orders]
protocol = "transaction"

[services.orders.ops]
new    = [{ table = "orders", op_type = "insert", fields = ["side", "symbol", "qty", "price"] }]
child  = [{ table = "orders", op_type = "insert", fields = ["side", "symbol", "qty", "price", "parent_id"] }]
fill   = [{ table = "orders", op_type = "update", key = ["id"], fields = ["status"], defaults = { status = "filled" } }]
cancel = [{ table = "orders", op_type = "update", key = ["id"], fields = ["status"], defaults = { status = "cancelled" } }]

# Live table of all orders (mkui subscribes here)
[services.all_orders]
protocol = "query"
primary_table = "orders"
filterable = ["status", "symbol"]

# Last filled trade per symbol
[services.last_trade]
protocol = "subpub"
primary_table = "orders"
topic = "symbol"
where = "status == 'filled'"

[services.last_trade.publish]
symbol = "symbol"
side   = "side"
price  = "price"
qty    = "qty"

[services.last_trade.defaults]
symbol = "_mkio_topic"

# Saved window layouts for mkui's Layout menu: one row per save, the
# newest being the current layout (`delete` is how the client prunes the
# history). With no login on this server every save goes to the default
# history (owner "").
[tables.mkui_layouts]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", app = "TEXT NOT NULL DEFAULT ''", owner = "TEXT NOT NULL DEFAULT ''", saved = "TEXT DEFAULT CURRENT_TIMESTAMP", layout = "TEXT NOT NULL" }

[services.mkui_layouts]
protocol = "transaction"

[services.mkui_layouts.ops]
save = [{ table = "mkui_layouts", op_type = "insert", fields = ["app", "owner", "layout"] }]
delete = [{ table = "mkui_layouts", op_type = "delete", key = ["id"] }]

[services.mkui_layouts_list]
protocol = "reqrep"
sql = "SELECT id, saved FROM mkui_layouts WHERE app = :app AND owner = :owner ORDER BY id DESC"

[services.mkui_layouts_get]
protocol = "reqrep"
sql = "SELECT id, saved, layout FROM mkui_layouts WHERE id = :id"

# Serve frontend: app at /, mkui framework assets at /mkui/
[static]
"/" = "./static"
"/mkui" = "../../"

# Serve config files
[config]
"/config" = "./config"
