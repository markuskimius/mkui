[app]
title = "Order Book"
theme = "dark"

[state.status]
message = "Connecting..."

# ─── Menubar ──────────────────────────────────────────────────────────

[[menubar]]
label = "Orders"
items = [
  { label = "All Orders", action = "pane.show", args = "all-orders" },
  { label = "Pending", action = "pane.show", args = "pending" },
  { label = "Order Tree", action = "pane.show", args = "order-tree" },
  { label = "Order Detail", action = "pane.show", args = "order-detail" },
]

[[menubar]]
label = "Edit"
items = [
  { label = "Copy", action = "edit.copy", shortcut = "mod+C" },
  { sep = true },
  { label = "Select All", action = "edit.selectAll", shortcut = "mod+A" },
  { label = "Find…", action = "edit.find", shortcut = "mod+F" },
]

[[menubar]]
label = "View"
items = [
  # table.filter sets a pane's column filters; the shapes match `filters`
  # under [panes.<id>]. `merge = true` leaves other columns' filters alone.
  { label = "All Orders: hide cancelled", action = "table.filter", args = { pane = "all-orders", filters = { status = { exclude = ["cancelled"] } }, merge = true } },
  { label = "All Orders: large sells", action = "table.filter", args = { pane = "all-orders", filters = { side = ["Sell"], notional = { from = 50000 } } } },
  { label = "All Orders: show everything", action = "table.filter", args = { pane = "all-orders", filters = {} } },
  { sep = true },
  # table.sort sets a pane's sort order; the shape matches `sort` under
  # [panes.<id>]: a column name ("-col" descending), { col, dir }, or an
  # array in priority order. No `sort` clears it.
  { label = "All Orders: newest first", action = "table.sort", args = { pane = "all-orders", sort = "-ts" } },
  { label = "All Orders: by symbol, largest first", action = "table.sort", args = { pane = "all-orders", sort = ["symbol", { col = "qty", dir = "desc" }] } },
  { label = "All Orders: clear sort", action = "table.sort", args = { pane = "all-orders" } },
  { sep = true },
  # table.columns sets which columns a pane shows, in that order; the shape
  # matches `visible` under [panes.<id>]. No `visible` shows every column.
  { label = "All Orders: compact view", action = "table.columns", args = { pane = "all-orders", visible = ["symbol", "side", "qty", "notional"] } },
  { label = "All Orders: all columns", action = "table.columns", args = { pane = "all-orders" } },
  { sep = true },
  # table.expand opens a tree pane's rows down to a depth (or "all"); no
  # `depth` collapses everything.
  { label = "Order Tree: expand all", action = "table.expand", args = { pane = "order-tree", depth = "all" } },
  { label = "Order Tree: children only", action = "table.expand", args = { pane = "order-tree", depth = 1 } },
  { label = "Order Tree: collapse all", action = "table.expand", args = { pane = "order-tree" } },
]

[[menubar]]
label = "Record"
items = [
  # The version timeline for whatever All Orders has selected: the chain
  # as a table, with a diff and a blame view under it. One history pane
  # per table, re-pointed as the selection moves rather than re-opened.
  { label = "History…", action = "table.history", args = { pane = "all-orders" } },
  # `keys` names the record instead, so a menu item can be a deep link.
  { label = "History of order 1", action = "table.history", args = { pane = "all-orders", keys = ["1"] } },
  { sep = true },
  # The steps the All Orders toolbar's Undo and Redo take, on the focused
  # pane. Deliberately without a shortcut: this writes to shared state.
  { label = "Undo record", action = "edit.undo" },
  { label = "Redo record", action = "edit.redo" },
  { sep = true },
  { label = "Audit Tape", action = "pane.show", args = "audit-tape" },
]

[[menubar]]
label = "Trades"
items = [
  { label = "Last Trade", action = "pane.show", args = "last-trade" },
]

[[menubar]]
label = "Layout"
items = [
  # Save the window arrangement — plus each open table's filters, sort, and
  # columns — under the login (or the default history without one); the
  # newest save comes back at startup. Restore lists earlier saves newest
  # first; Reset returns to the frames and pane defaults in this file.
  { label = "Save Layout", action = "layout.save" },
  { label = "Restore Layout", layouts = true },
  { sep = true },
  { label = "Reset to Default", action = "layout.reset" },
]

[[menubar]]
label = "Window"
items = [
  { label = "Tile Horizontally", action = "window.tileH" },
  { label = "Tile Vertically", action = "window.tileV" },
  { label = "Grid", action = "window.grid" },
  { label = "Cascade", action = "window.cascade" },
  { sep = true },
  { windows = true },
]

# ─── Statusbar ─────────────────────────────────────────────────────────

# The statusbar colours itself by the connection — grey while connecting,
# red while the server is away, amber when it is the wrong one — and wears
# a dot and, in an outage, a clock; the message is this widget's. A
# `[statusbar.bindStyle]` map (README) would override the colours from
# state instead.
[statusbar]
left = [{ type = "text", bind = "status.message" }]
right = [{ type = "text", text = "mkio-table demo" }]

# ─── Panes ─────────────────────────────────────────────────────────────

[panes.all-orders]
title = "All Orders"
type = "mkio-table"
service = "all_orders"
protocol = "query"
# "notional" is a derived column — an expression over the row's fields. It
# exists in no row, so it must be listed in `columns` explicitly. Derived
# values are what the table sorts, filters, and copies. SPREAD_BPS is an
# application function registered in static/app.js.
columns = ["id", "_mkio_version", "ts", "side", "symbol", "qty", "price", "notional", "status", "tif", "note"]
# `_mkio_version` is mkio's own column — the cursor into the record's
# chain, and the one thing the row itself says about its history. Naming
# it here is what shows it; mkio's columns are hidden otherwise, and
# `labels` overrides the default heading ("Version") as for any column.
labels = { ts = "Time", _mkio_version = "Ver", tif = "TIF" }
values = { notional = "ROUND(qty * price, 2)" }
# Which columns show, in this order. `id` and `price` start hidden — the
# Columns button at the header's right edge (badge: 2) opens the picker
# that brings them back; each header's dropdown has "Hide column". Hidden
# columns still work: `notional` is derived from the hidden
# `price`, and sorts and filters on hidden columns still apply. Without
# `visible`, every column shows, including ones added later.
visible = ["ts", "side", "symbol", "qty", "notional", "status", "_mkio_version"]
# Column groups categorise the picker (sections with show/hide-the-group
# toggles; ungrouped columns fall into "Other"). Structure only — `visible`
# says what shows. With hundreds of columns this is how a user finds the
# few they want; the config's `visible` is the curated default they can
# always reset to.
groups = [
  { label = "Order",   columns = ["id", "_mkio_version", "ts", "side", "symbol"] },
  { label = "Pricing", columns = ["qty", "price", "notional"] },
  { label = "Execution", columns = ["tif", "note"] },
]
# Mirror the current row into app state; the order-detail pane follows it.
select = { state = "selected_order" }
# Table linking: broadcast the selected rows' `id` as "order_id" and their
# `symbol` as "symbol". The Child Orders pane listens for "order_id" on its
# `parent_id` column and the Pending pane for "symbol", so selecting
# orders here filters both (several rows: all their values). The chips on
# the toolbar show the links; click one to pause that direction (or set
# `link.chips = false` to keep them off the toolbar, pausing from the
# advanced dropdown instead). Alt/option-click a header's filter button
# for "Broadcast as…" / "Listen for…" to set them up by hand; a saved
# layout keeps them.
link.broadcast = { order_id = "id", symbol = "symbol" }
# Conditional styling, config-only: rules are evaluated first-match-wins;
# `value` is the cell's value, row fields are in scope by name, and string
# values may be ${...} templates. A rule without `when` is the fallback.
[panes.all-orders.styles]
side = [ { when = "value == 'Buy'", color = "#4caf50" }, { color = "#e05252" } ]
qty = [ { background = "${IF(value >= 500, '#2b3a4a', '')}" } ]

[[panes.all-orders.rowStyle]]
when = "notional >= 50000 && side == 'Sell'"
background = "#3a2f1b"

# Default column filters, in effect before the first row arrives and
# restored when the pane is reopened (View → "show everything" clears them,
# or use the header filter buttons). Each entry is a values filter — a bare
# list shows only those values; `include`/`exclude` say which way — or a
# range: `from`/`to` numbers make a number range, "2026-03-01" /
# "2026-03-01 09:30" strings a time range (a date covers its whole day,
# `empty = true` lets blank cells through), and `preset` is today, 1h,
# or 15m. Ranges work on derived columns like `notional` too.
[panes.all-orders.filters]
status = { exclude = ["cancelled"] }   # statuses seen later still show
notional = { from = 1000 }             # small orders start hidden

# Display templates control presentation only — sorting, filtering, and
# alignment still use the value. The `mkui` library adds rich segments:
# BOLD/ITALIC/COLOR/MUTED/MONO, BADGE, ICON, BAR, LINK, HEAT.
[panes.all-orders.display]
symbol = "${BOLD(value)}"
side = "${BADGE(value, IF(value == 'Buy', 'green', 'red'))}"
notional = "${NUM(value, digits: 2, group: TRUE)}"
status = "${ICON(CASE(value == 'filled', 'check', value == 'cancelled', 'close', 'clock'))} ${TITLE(value)}"

# Where this table's record history lives. `versioned = true` on the
# server's orders table is what records it; mkio advertises no history
# table and writes no service for one, so this block is the only way the
# client can know — every name here is a service in server.toml.
#
# What it buys: Undo and Redo on the toolbar, stepping the selected orders
# along their own versions with a confirmation that says what will change;
# an *As of…* button that shows the table as it stood at a moment,
# read-only, until *Live* re-subscribes; and Record → History…, the
# version timeline for the selected order.
[panes.all-orders.history]
table    = "orders"          # checked against the server's versioned tables
key      = ["id"]            # asked of the server when omitted
versions = "order_versions"  # one record's chain: the history pane
state    = "order_state"     # where the row sits in it: arms Redo
feed     = "order_history"   # the audit tape
undo     = { service = "orders", op = "undo" }
redo     = { service = "orders", op = "redo" }
asOf     = "order_as_of"     # the table as it stood at a moment

[[panes.all-orders.buttons]]
label = "+ New Order"
enable = { connected = true }

[panes.all-orders.buttons.action]
type = "dialog"

# The dialog is live: the title, the read-only notional, and the footer
# note re-evaluate as the form is edited. `compute` gives a field its value
# from the others (on an editable field only until the user types in it).
[panes.all-orders.buttons.action.dialog]
title = "New ${side} Order"
modal = true
width = 420
footer = { note = "${IF(_filled, NUM(qty * price, digits: 2, group: TRUE) + ' notional', 'Enter quantity and price')}" }

# A `{ group }` heads a section: everything up to the next header sits
# under it. This one is a plain header — the fields it holds are the
# order, always in view.
[[panes.all-orders.buttons.action.dialog.fields]]
group = "Order"

[[panes.all-orders.buttons.action.dialog.fields]]
row = [
  { name = "side", label = "Side", type = "select", width = 0.35, options = ["Buy", "Sell"], required = true },
  { name = "symbol", label = "Symbol", type = "text", width = 0.65, pattern = "^[A-Z]{1,5}$", placeholder = "e.g. AAPL", required = true },
]

[[panes.all-orders.buttons.action.dialog.fields]]
row = [
  { name = "qty", label = "Quantity", type = "number", width = 0.5, min = 1, required = true },
  { name = "price", label = "${side} price", type = "number", width = 0.5, step = 0.01, min = 0, required = true },
]

# A `_`-prefixed field is never submitted: a scratch value for the others.
# Empty number fields read as NULL, so `??` guards the blanks.
[[panes.all-orders.buttons.action.dialog.fields]]
name = "_filled"
type = "hidden"
compute = "(qty ?? 0) > 0 && (price ?? 0) > 0"

[[panes.all-orders.buttons.action.dialog.fields]]
name = "notional"
label = "Notional"
type = "readonly"
compute = "${IF(_filled, NUM(qty * price, digits: 2, group: TRUE), '')}"
showWhen = "_filled"

# The rarely-touched options fold away behind a collapsible header: a
# caret marks it, a click (or Enter, Space; alt/option-click for every
# section at once) opens it, `collapsed` starts it folded, and `remember`
# keeps the fold in localStorage, so someone who always sets a time in
# force finds it open next time. Folded fields still submit, and a folded
# head counts the fields edited under it — "2 changed" — so nothing set
# here goes unnoticed; a required field left empty unfolds it on submit.
# Give `summary` a template to say something more specific instead.
[[panes.all-orders.buttons.action.dialog.fields]]
group = "Execution"
collapsible = true
collapsed = true
remember = "orders.new.execution"

[[panes.all-orders.buttons.action.dialog.fields]]
row = [
  { name = "tif", label = "Time in force", type = "select", width = 0.4, options = ["Day", "GTC", "IOC"], value = "Day" },
  { name = "note", label = "Note", type = "text", width = 0.6, placeholder = "for the desk" },
]

[panes.all-orders.buttons.action.dialog.submit]
label = "Place Order"
service = "orders"
op = "new"

[[panes.all-orders.buttons]]
label = "Fill"
enable = { connected = true, when = "LEN(rows) > 0 && ALL(rows, r -> r.status == 'pending')" }
action = { type = "transaction", service = "orders", op = "fill", data = { id = "${row.id}" } }

[[panes.all-orders.buttons]]
label = "Cancel"
enable = { connected = true, when = "LEN(rows) > 0 && ALL(rows, r -> r.status == 'pending')" }
# `style` takes the same keys as a cell styler: a plain map, or rules whose
# conditions see the button's scope plus `enabled` — red only once armed.
# Rules don't merge, so keep what sets the button's size (bold, caps) the
# same in every branch and let only the colors follow the state; otherwise
# the label changes width as the button arms and its neighbours shift.
style = [
  { when = "enabled", background = "#c62828", color = "white", bold = true, caps = true },
  { bold = true, caps = true },
]
action = { type = "transaction", service = "orders", op = "cancel", data = { id = "${row.id}" } }

# Undo, Redo and "As of…" arrive on their own — the `history` block above
# is what puts them there. The version timeline does not: it opens through
# the `table.history` action, so a table that wants it next to them says
# so. `unit = "row"` means exactly one record, which is what a history is
# about; with no `keys` the action takes the pane's current selection.
[[panes.all-orders.buttons]]
label = "History"
unit = "row"
enable = { connected = true }
action = { type = "action", name = "table.history", args = { pane = "all-orders" } }

[panes.pending]
title = "Pending"
type = "mkio-table"
service = "all_orders"
protocol = "query"
filter = "status == 'pending'"
columns = ["id", "side", "symbol", "qty", "price", "status"]
# Default sort order, restored when the pane is reopened: by symbol, then
# largest quantity first. Active sorts and filters show as chips on the
# toolbar, where they can be flipped, opened, or cleared.
sort = ["symbol", "-qty"]
# Only these columns show, in this order (the rest are one "hidden" chip
# away). Without `visible`, every column shows — including any added to
# `columns` later; with it, the set is exactly this until someone changes it.
visible = ["symbol", "side", "qty", "price"]
# Follow All Orders: whatever symbol is selected there filters this table
# (the link's filter shows as a tinted chip; clearing the selection there
# lets every symbol back). Click the Listen chip to stop following.
link.listen = { symbol = "symbol" }

# Button styling. A plain `style` map applies from the start, whatever the
# button's state — the same keys as a cell styler (`color`, `background`,
# `bold`, `italic`, `underline`, `strike`, `caps`, `class`, `css`); the
# background keeps hover and press as tints of the configured color, and a
# disabled button fades as usual. Compare the All Orders pane, whose Cancel
# uses a rule array so the color arrives only once the button is armed.
[[panes.pending.buttons]]
label = "Fill"
enable = { connected = true, minSelected = 1 }
style = { background = "#2e7d32", color = "white", bold = true }
action = { type = "transaction", service = "orders", op = "fill", data = { id = "${row.id}" } }

[[panes.pending.buttons]]
label = "Cancel"
enable = { connected = true, minSelected = 1 }
style = { background = "red", color = "black", bold = true, caps = true }
action = { type = "transaction", service = "orders", op = "cancel", data = { id = "${row.id}" } }

# Tree rows: parent orders with their child orders nested under them (and
# a child's children under it, any depth). `tree.child` names this row's
# link field(s), `tree.parent` the field(s) on the parent they point at —
# a row whose `parent_id` is empty is a top-level order. Only top-level
# orders show at first; the caret in the first column expands a row
# (shift+click: its whole subtree; the header caret: every root, or every
# level with shift; Enter / `*` on the keyboard). `expand = 1` would open
# the first level at load. Sorting orders the top level, then each group
# of siblings. Filters apply to top-level orders (a match shows with its
# children); alt/option-click a filter button for the scope tabs — Top,
# Child (children tested, a miss hides its subtree), and Branch (every
# row tested, but a row stays while any row below it matches) — each
# holding its own filter, so a column can filter all three ways at once.
# A configured filter takes `scope` the same way, and a column takes an
# array of them for several scopes.
# Ctrl/Cmd+A and copy see exactly the expanded rows.
[panes.order-tree]
title = "Order Tree"
type = "mkio-table"
service = "all_orders"
protocol = "query"
columns = ["symbol", "id", "parent_id", "side", "qty", "price", "notional", "status"]
labels = { parent_id = "Parent" }
values = { notional = "ROUND(qty * price, 2)" }
tree = { child = "parent_id", parent = "id" }
# Hide cancelled child orders while still listing every parent.
filters = { status = { exclude = ["cancelled"], scope = "children" } }
select = { state = "selected_order" }

[panes.order-tree.display]
symbol = "${BOLD(value)}"
side = "${BADGE(value, IF(value == 'Buy', 'green', 'red'))}"
notional = "${NUM(value, digits: 2, group: TRUE)}"
status = "${ICON(CASE(value == 'filled', 'check', value == 'cancelled', 'close', 'clock'))} ${TITLE(value)}"

# Place a child order under the selected order: the dialog carries the
# parent's id in a hidden field and starts from its symbol and side.
[[panes.order-tree.buttons]]
label = "+ Child Order"
unit = "row"
enable = { connected = true }

[panes.order-tree.buttons.action]
type = "dialog"

[panes.order-tree.buttons.action.dialog]
title = "Child Order of #${row.id}"
modal = true
width = 420

[[panes.order-tree.buttons.action.dialog.fields]]
name = "parent_id"
type = "hidden"
value = "${row.id}"

[[panes.order-tree.buttons.action.dialog.fields]]
row = [
  { name = "side", label = "Side", type = "select", width = 0.35, options = ["Buy", "Sell"], value = "${row.side}", required = true },
  { name = "symbol", label = "Symbol", type = "text", width = 0.65, pattern = "^[A-Z]{1,5}$", value = "${row.symbol}", required = true },
]

[[panes.order-tree.buttons.action.dialog.fields]]
row = [
  { name = "qty", label = "Quantity", type = "number", width = 0.5, min = 1, required = true },
  { name = "price", label = "Price", type = "number", width = 0.5, step = 0.01, min = 0, value = "${row.price}", required = true },
]

[panes.order-tree.buttons.action.dialog.submit]
label = "Place Child Order"
service = "orders"
op = "child"

[[panes.order-tree.buttons]]
label = "Fill"
enable = { connected = true, when = "LEN(rows) > 0 && ALL(rows, r -> r.status == 'pending')" }
action = { type = "transaction", service = "orders", op = "fill", data = { id = "${row.id}" } }

[[panes.order-tree.buttons]]
label = "Cancel"
enable = { connected = true, when = "LEN(rows) > 0 && ALL(rows, r -> r.status == 'pending')" }
action = { type = "transaction", service = "orders", op = "cancel", data = { id = "${row.id}" } }

[panes.order-detail]
title = "Order Detail"
type = "order-detail"
follow = "selected_order"

# The children of whatever is selected in All Orders: the "order_id" it
# broadcasts (the parent's `id`) filters this table's `parent_id`. A pane
# may listen and broadcast at once — selecting a child here sends its own
# id on under "child_id" for a table further down a chain.
[panes.child-orders]
title = "Child Orders"
type = "mkio-table"
service = "all_orders"
protocol = "query"
columns = ["id", "parent_id", "side", "symbol", "qty", "price", "status"]
labels = { parent_id = "Parent" }
link.listen = { order_id = "parent_id" }
link.broadcast = { child_id = "id" }

# Every recorded version of every order, newest first, arriving live as
# changes land — an ordinary query pane over the history table, with no
# history block of its own. `_mkio_op`, `_mkio_user` and `_mkio_ref` are
# mkio's own columns, shown because they are named. The pane is parked (no
# frame lists it): Record → Audit Tape opens it in a frame of its own.
[panes.audit-tape]
title = "Audit Tape"
type = "mkio-table"
service = "order_history"
protocol = "query"
columns = ["_mkio_ref", "id", "_mkio_version", "_mkio_op", "_mkio_user", "side", "symbol", "qty", "price", "status"]
labels = { _mkio_ref = "When", _mkio_version = "Ver", id = "Order", _mkio_user = "Changed by" }
sort = "-_mkio_ref"

[panes.audit-tape.display]
# The ref is a UTC timestamp; REF_TIME reads it in the browser's zone.
_mkio_ref  = "${REF_TIME(value, fmt: '%H:%M:%S', tz: 'local')}"
_mkio_op   = "${BADGE(value, CASE(value == 'insert', 'green', value == 'baseline', 'gray', '#0e639c'))}"
_mkio_user = "${value ?? MUTED('(system)')}"

# Filtering would narrow what you are looking at; this jumps to the record
# instead, leaving All Orders showing everything around it. A key its
# filters hide is reported back rather than revealed, so an order below
# the pane's `notional` floor says so instead of silently doing nothing.
[[panes.audit-tape.buttons]]
label = "Go to order"
enable = { minSelected = 1, maxSelected = 1 }
action = { type = "action", name = "table.select", args = { pane = "all-orders", keys = ["${row.id}"] } }

[panes.last-trade]
title = "Last Trade"
type = "mkio-table"
service = "last_trade"
protocol = "subpub"
topic = ["AAPL", "GOOG", "MSFT", "AMZN", "TSLA", "NVDA"]

# ─── Frames ───────────────────────────────────────────────────────────

[[frames]]
id = "main"
x = 0.02
y = 0.03
w = 0.64
h = 0.94
layout = { type = "tabs", active = 0, children = ["all-orders", "pending", "order-tree"] }

[[frames]]
id = "sidebar"
x = 0.68
y = 0.03
w = 0.30
h = 0.55
layout = { type = "tabs", active = 0, children = ["last-trade", "order-detail"] }

[[frames]]
id = "children"
x = 0.68
y = 0.60
w = 0.30
h = 0.37
layout = { type = "tabs", active = 0, children = ["child-orders"] }

# ─── mkio connection ──────────────────────────────────────────────────

[mkio]
url = "ws://localhost:8080/ws"
# The control channel: a Python process embedding mkio can push actions
# (table.link, table.filter, pane.show, …) to every open browser through
# this service — see control.py beside this config. `mkui serve` installs
# it too, so the subscription always succeeds.
control = "_mkui"

# What this app requires of the server it connects to; a mismatch applies
# `incompatible` below. `name` and `version` are the app's own (server.toml
# sets them), `protocol` the wire protocol, `expr` the expression language,
# matched exactly. mkui's own requirement — an mkio 1.x server — is checked
# whether or not this block exists, so `mkio` is pinned only by an app that
# needs a particular minor's additions (`"1.2"` accepts 1.2.0 and later
# 1.x; a `0.x` pin no 1.x server accepts). tests/test_examples.py runs
# this block against server.toml, so a stale pin fails there rather than
# quietly reading "Incompatible order-book version" in the statusbar.
[mkio.expect]
name = "order-book"
version = "1.0"
protocol = "1.0"
expr = "1"

[mkio.connected]
"status.message" = "Connected"

# The entry per reason (`unreachable`: no `_mkio` reply, `name`: another
# application, `version`: this one at a version the pins above reject)
# supplies the message; a flat entry beside them would apply to every
# reason.
[mkio.incompatible]
unreachable = { "status.message" = "Not an mkio server" }
name = { "status.message" = "Not the order-book server" }
version = { "status.message" = "Incompatible order-book version" }

[mkio.disconnected]
"status.message" = "Disconnected"

# What the shell does about an outage, beyond the message: the tab title
# and favicon change, a banner drops in under the menubar after `delay`
# seconds (at once for an incompatible server), and the workspace and its
# tables read as stale. Every key defaults on; `offline = false` turns
# the lot off. Shown here at the defaults.
[mkio.offline]
indicator = true   # the statusbar's dot and outage clock
title = true       # "⚠ Disconnected · Order Book" in the tab
favicon = true     # a red dot for the tab's icon
banner = true      # the strip under the menubar
delay = 3          # seconds down before the banner shows
stale = true       # the hatched tint and the "as of" stamps

# ─── Saved layouts ────────────────────────────────────────────────────
# Enables the Layout menu's actions and the startup restore of the latest
# saved layout. Stored on the mkio server (server.toml declares the
# mkui_layouts table and services). Per owner, the newest `keep` saves or
# the last `keepDays` days are kept, whichever is more.

[layouts]
keep = 10
keepDays = 7
