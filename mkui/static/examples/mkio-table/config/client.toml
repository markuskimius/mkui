[app]
title = "Order Book"
theme = "dark"

[state.status]
message = "Connecting..."
color = "#000000"
background = "#b8b8b8"

# ─── Menubar ──────────────────────────────────────────────────────────

[[menubar]]
label = "Edit"
items = [
  { label = "Copy", action = "edit.copy", shortcut = "mod+C" },
  { sep = true },
  { label = "Select All", action = "edit.selectAll", shortcut = "mod+A" },
]

[[menubar]]
label = "Orders"
items = [
  { label = "All Orders", action = "pane.show", args = "all-orders" },
  { label = "Pending", action = "pane.show", args = "pending" },
]

[[menubar]]
label = "Trades"
items = [
  { label = "Last Trade", action = "pane.show", args = "last-trade" },
]

[[menubar]]
label = "Window"
items = [
  { label = "Tile Horizontally", action = "window.tileH" },
  { label = "Tile Vertically", action = "window.tileV" },
  { label = "Grid", action = "window.grid" },
  { label = "Cascade", action = "window.cascade" },
  { sep = true },
  { windows = true },
]

# ─── Statusbar ─────────────────────────────────────────────────────────

[statusbar]
left = [{ type = "text", bind = "status.message" }]
right = [{ type = "text", text = "mkio-table demo" }]

[statusbar.bindStyle]
color = "status.color"
background = "status.background"

# ─── Panes ─────────────────────────────────────────────────────────────

[panes.all-orders]
title = "All Orders"
type = "mkio-table"
service = "all_orders"
protocol = "query"

[[panes.all-orders.buttons]]
label = "+ New Order"
enable = { connected = true }

[panes.all-orders.buttons.action]
type = "dialog"

[panes.all-orders.buttons.action.dialog]
title = "New Order"
modal = true
width = 420

[[panes.all-orders.buttons.action.dialog.fields]]
row = [
  { name = "side", label = "Side", type = "select", width = 0.35, options = ["Buy", "Sell"], required = true },
  { name = "symbol", label = "Symbol", type = "text", width = 0.65, pattern = "^[A-Z]{1,5}$", placeholder = "e.g. AAPL", required = true },
]

[[panes.all-orders.buttons.action.dialog.fields]]
row = [
  { name = "qty", label = "Quantity", type = "number", width = 0.5, min = 1, required = true },
  { name = "price", label = "Price", type = "number", width = 0.5, step = 0.01, min = 0, required = true },
]

[panes.all-orders.buttons.action.dialog.submit]
label = "Place Order"
service = "orders"
op = "new"

[[panes.all-orders.buttons]]
label = "Fill"
enable = { connected = true, minSelected = 1, rowMatch = { status = "pending" } }
action = { type = "transaction", service = "orders", op = "fill", data = { id = "${row.id}" } }

[[panes.all-orders.buttons]]
label = "Cancel"
enable = { connected = true, minSelected = 1, rowMatch = { status = "pending" } }
action = { type = "transaction", service = "orders", op = "cancel", data = { id = "${row.id}" } }

[panes.pending]
title = "Pending"
type = "mkio-table"
service = "all_orders"
protocol = "query"
filter = "status == 'pending'"
columns = ["id", "side", "symbol", "qty", "price", "status"]

[[panes.pending.buttons]]
label = "Fill"
enable = { connected = true, minSelected = 1 }
action = { type = "transaction", service = "orders", op = "fill", data = { id = "${row.id}" } }

[[panes.pending.buttons]]
label = "Cancel"
enable = { connected = true, minSelected = 1 }
action = { type = "transaction", service = "orders", op = "cancel", data = { id = "${row.id}" } }

[panes.last-trade]
title = "Last Trade"
type = "mkio-table"
service = "last_trade"
protocol = "subpub"
topic = ["AAPL", "GOOG", "MSFT", "AMZN", "TSLA", "NVDA"]

# ─── Frames ───────────────────────────────────────────────────────────

[[frames]]
id = "main"
x = 0.02
y = 0.03
w = 0.64
h = 0.94
layout = { type = "tabs", active = 0, children = ["all-orders", "pending"] }

[[frames]]
id = "sidebar"
x = 0.68
y = 0.03
w = 0.30
h = 0.55
layout = { type = "tabs", active = 0, children = ["last-trade"] }

# ─── mkio connection ──────────────────────────────────────────────────

[mkio]
url = "ws://localhost:8080/ws"

[mkio.expect]
name = "order-book"
version = "1.0"
protocol = "1.0"
mkio = "0.1"

[mkio.connected]
"status.message" = "Connected"
"status.color" = ""
"status.background" = ""

[mkio.incompatible]
"status.message" = "Wrong server"
"status.color" = "#ffffff"
"status.background" = "#cc0000"

[mkio.disconnected]
"status.message" = "Disconnected"
"status.color" = "#000000"
"status.background" = "#b8b8b8"
