# Record history: a versioned table, its audit tape, and the panes that
# read them. Everything here is config — no application JavaScript.

[app]
title = "Record history"
theme = "dark"
# What Help → About shows, beside the server and connection it finds itself.
version = "1.0"
description = "A versioned table, its audit tape, and the panes that read them."

[state.status]
message = "Connecting..."

# ─── Menubar ──────────────────────────────────────────────────────────

[[menubar]]
label = "Record"
items = [
  # Opens the history pane for whatever the Orders table has selected —
  # one pane per table, re-pointed rather than re-opened.
  { label = "History…", action = "table.history", args = { pane = "orders" } },
  # `keys` selects the record first, so a menu item can name the one it
  # means: a deep link to a record's history.
  { label = "History of order 1", action = "table.history", args = { pane = "orders", keys = ["1"] } },
  # Push the Orders table's selected record into the detail window, for
  # when you want to look at one without waiting for a broadcast.
  { label = "Show details", action = "table.record", args = { pane = "detail", from = "orders" } },
  { sep = true },
  # The same steps the toolbar's Undo and Redo take, on the focused pane.
  { label = "Undo record", action = "edit.undo", disabled = "!pane.can.undo || (selection.count ?? 0) == 0", disabledTitle = "Select a record in Orders" },
  { label = "Redo record", action = "edit.redo" },
]

[[menubar]]
label = "Edit"
items = [
  # Greyed out over a pane that cannot do it: `pane.can` is the focused
  # pane's edit actions, read each time the menu opens.
  { label = "Copy", action = "edit.copy", shortcut = "mod+C", disabled = "!pane.can.copy" },
  { label = "Select All", action = "edit.selectAll", shortcut = "mod+A" },
  { label = "Find…", action = "edit.find", shortcut = "mod+F", disabled = "!pane.can.find" },
]

[[menubar]]
label = "View"
items = [
  { label = "Tape: inserts only", action = "table.filter", args = { pane = "tape", filters = { _mkio_op = ["insert"] } } },
  { label = "Tape: order 2 only", action = "table.filter", args = { pane = "tape", filters = { id = [2] } } },
  { label = "Tape: everything", action = "table.filter", args = { pane = "tape", filters = {} } },
  { sep = true },
  { label = "Orders: show every record", action = "table.link", args = { pane = "orders", listening = false, merge = true } },
  { label = "Orders: follow the tape again", action = "table.link", args = { pane = "orders", listening = true, merge = true } },
  { sep = true },
  # The detail window's subject: pin it where it is, or let it follow the
  # broadcast again. The same switch its toolbar pin throws.
  { label = "Detail: pin to this record", action = "record.follow", args = { pane = "detail", listening = false, merge = true } },
  { label = "Detail: follow the tape again", action = "record.follow", args = { pane = "detail", listening = true, merge = true } },
]

[[menubar]]
label = "Window"
items = [
  { label = "Tile Horizontally", action = "window.tileH" },
  { label = "Tile Vertically", action = "window.tileV" },
  { label = "Grid", action = "window.grid" },
  { label = "Cascade", action = "window.cascade" },
  { sep = true },
  # One item per open pane, rebuilt each time the menu opens.
  { windows = true },
]

[[menubar]]
label = "Help"
items = [
  { label = "About Record history", action = "dialog.about" },
]

# ─── The live table ───────────────────────────────────────────────────

[panes.orders]
title = "Orders"
type = "mkio-table"
service = "all_orders"
protocol = "query"
# `_mkio_version` is mkio's own column — the cursor into the record's
# chain. Naming it here is what shows it; it is hidden otherwise.
# `note` is unversioned on the server (server.toml), so it shows here and
# in the detail window but has no column in the history pane.
columns = ["id", "_mkio_version", "side", "symbol", "qty", "price", "status", "note"]
labels = { id = "ID" }
# The audit tape publishes the id of the change you click; this table
# narrows to that record. The chip on the toolbar shows the link and
# takes it off again.
link = { listen = { order_id = "id" } }

# Presentation only: what a cell shows, never what it sorts or filters by.
[panes.orders.display]
status = "${BADGE(value, CASE(value == 'filled', 'green', value == 'cancelled', 'red', 'gray'))}"
side   = "${COLOR(value, IF(value == 'Buy', '#4caf50', '#e05252'))}"

# Where this table's record history lives. mkio advertises no history
# table and writes no service for one, so this block is the only way the
# client can know — every name here is a service in server.toml.
[panes.orders.history]
table    = "orders"          # checked against the server's versioned tables
key      = ["id"]            # asked of the server when omitted
versions = "order_versions"  # one record's chain: the history pane
state    = "order_state"     # where the row sits in it: arms Redo
feed     = "order_history"   # the audit tape
undo     = { service = "orders", op = "undo" }
redo     = { service = "orders", op = "redo" }
asOf     = "order_as_of"     # the table as it stood at a moment

# ─── One record ───────────────────────────────────────────────────────
# A detail window. It is not told which record twice: the audit tape
# broadcasts `order_id`, and this listens for it — the same name the
# Orders table filters by. Click a change on the tape and the table
# narrows, this window fills, and the tab takes the record's name.
#
# `source` lends the Orders table's labels, display templates and key, so
# a status reads here exactly as it reads in the cell.

[panes.detail]
title = "Order"
type = "mkio-record"
service = "all_orders"
source = "orders"
fields = ["id", "side", "symbol", "qty", "price", "status", "_mkio_version", "note"]
groups = [
  { label = "Instruction", columns = ["id", "side", "symbol", "qty", "price"] },
  { label = "Progress", columns = ["status", "_mkio_version"] },
  { label = "Notes", columns = ["note"] },
]
labels = { _mkio_version = "Version" }

[panes.detail.record]
listen = { order_id = "id" }
# The tape's selection clears as you filter it; the window keeps the last
# record rather than emptying.
retain = true
title = "${symbol} #${id}"

# ─── The audit tape ───────────────────────────────────────────────────
# An ordinary query pane over the history table: every recorded version,
# newest first, arriving live as changes land. `_mkio_op`, `_mkio_user`
# and `_mkio_ref` are mkio's own columns, shown because they are named.

[panes.tape]
title = "Audit tape"
type = "mkio-table"
service = "order_history"
protocol = "query"
columns = ["_mkio_ref", "id", "_mkio_version", "_mkio_op", "_mkio_user", "side", "symbol", "qty", "price", "status"]
labels = { _mkio_ref = "When", _mkio_version = "Ver", id = "Order", _mkio_user = "Changed by" }
sort = "-_mkio_ref"
# Selecting a change publishes its order id; the Orders table listens.
link = { broadcast = { order_id = "id" } }

[panes.tape.display]
# The ref is a UTC timestamp; REF_TIME reads it in the browser's zone.
_mkio_ref  = "${REF_TIME(value, fmt: '%H:%M:%S', tz: 'local')}"
_mkio_op   = "${BADGE(value, CASE(value == 'insert', 'green', value == 'baseline', 'gray', '#0e639c'))}"
_mkio_user = "${value ?? MUTED('(system)')}"

# Filtering narrows what you are looking at; this jumps to the record
# instead, leaving the table showing everything around it.
[[panes.tape.buttons]]
label = "Go to order"
enable = { minSelected = 1, maxSelected = 1 }
action = { type = "action", name = "table.select", args = { pane = "orders", keys = ["${row.id}"] } }

# ─── Frames ───────────────────────────────────────────────────────────

[[frames]]
id = "main"
x = 0.02
y = 0.03
w = 0.56
h = 0.48
layout = { type = "tabs", active = 0, children = ["orders"] }

[[frames]]
id = "tape"
x = 0.02
y = 0.53
w = 0.56
h = 0.44
layout = { type = "tabs", active = 0, children = ["tape"] }

[[frames]]
id = "detail"
x = 0.60
y = 0.03
w = 0.38
h = 0.48
layout = { type = "tabs", active = 0, children = ["detail"] }

# ─── Connection ───────────────────────────────────────────────────────

# Relative to the page: the app follows the server to whatever host and
# port it is served on (`mkui serve . -p 9000`).
[mkio]
url = "/ws"
connected    = { "status.message" = "Connected" }
disconnected = { "status.message" = "Disconnected" }

# What this app requires of the server: its own name and version, both
# set in server.toml. mkui's own requirement — an mkio 1.x server — is
# checked whether or not this block exists; `mkio` is pinned here only
# by an app that needs a particular minor's additions.
[mkio.expect]
name = "order-history"
version = "1.0"

[mkio.incompatible]
"status.message" = "Not the order-history server"
version = { "status.message" = "Incompatible order-history server" }

[statusbar]
left  = [{ type = "text", text = "${state.status.message}" }]
right = [{ type = "text", text = "versioned: ${state.mkio.server.versioned}" }]
